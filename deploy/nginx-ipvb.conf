# Nginx: recebe o tráfego da internet e repassa para o site (PM2, porta 3000).
# Copie para /etc/nginx/sites-available/ipvb, ative com
#   ln -s /etc/nginx/sites-available/ipvb /etc/nginx/sites-enabled/
# e gere o HTTPS com: certbot --nginx -d ipvb.org.br -d www.ipvb.org.br
# (o certbot acrescenta sozinho os blocos de SSL e o redirecionamento para https).

server {
    listen 80;
    listen [::]:80;
    server_name ipvb.org.br www.ipvb.org.br;

    # Fotos enviadas pelo painel podem ter alguns MB.
    client_max_body_size 20M;

    # Arquivos do build têm hash no nome: podem ficar em cache por muito tempo.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
